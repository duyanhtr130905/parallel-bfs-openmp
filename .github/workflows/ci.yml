name: Bootstrap CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: bootstrap-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-05
        with:
          persist-credentials: false
      - name: Compile and test the real scaffold
        run: make CC=gcc PYTHON=python3 build test check-openmp
      - name: Verify optional plotting tools with synthetic unit fixtures
        run: |
          python3 -m venv build/plot-venv
          build/plot-venv/bin/python -m pip install matplotlib
          make PYTHON=build/plot-venv/bin/python test-plots

  windows:
    name: bootstrap-windows-ucrt64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2, verified 2026-11-05
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-python
      - name: Verify UCRT64 toolchain and OpenMP library ownership
        shell: msys2 {0}
        run: |
          test "$MSYSTEM" = UCRT64
          test "$(command -v gcc)" = /ucrt64/bin/gcc
          test "$(command -v python)" = /ucrt64/bin/python
          test "$(command -v mingw32-make)" = /ucrt64/bin/mingw32-make
          pacman -Q mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libgomp mingw-w64-ucrt-x86_64-make mingw-w64-ucrt-x86_64-python
          gcc -dumpmachine
          gcc -print-prog-name=ld
          gcc -print-search-dirs
          for lib in libgomp.dll.a libgomp.a; do
            path=$(gcc -print-file-name="$lib")
            test "$path" != "$lib"
            test -f "$path"
            pacman -Qo "$path"
          done
      - name: Compile and test on the target platform
        shell: msys2 {0}
        run: mingw32-make CC=gcc PYTHON=python build test check-openmp

  report:
    name: report-xelatex
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install report tools on the temporary CI runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-fonts-recommended
      - name: Compile the real report
        run: make report
      - name: Preserve report for PDF inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bootstrap-report-${{ github.sha }}
          path: |
            report/main.pdf
            report/main.log
            report/main.bbl
            report/main.toc
          if-no-files-found: error
