name: Bootstrap CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: bootstrap-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-05
        with:
          persist-credentials: false
      - name: Compile and test the real scaffold
        run: make CC=gcc PYTHON=python3 build test check-openmp
      - name: Verify optional plotting tools with synthetic unit fixtures
        run: |
          python3 -m venv build/plot-venv
          build/plot-venv/bin/python -m pip install matplotlib psutil
          make PYTHON=build/plot-venv/bin/python test-plots test-supplement test-review
      - name: Verify regenerated report tables from committed samples
        run: |
          make PYTHON=build/plot-venv/bin/python tables supplement-artifacts review-artifacts
          git diff --exit-code -- report/generated/

  windows:
    name: bootstrap-windows-ucrt64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2, verified 2026-11-05
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-python
      - name: Verify UCRT64 toolchain and OpenMP library ownership
        shell: msys2 {0}
        run: |
          test "$MSYSTEM" = UCRT64
          test "$(command -v gcc)" = /ucrt64/bin/gcc
          test "$(command -v python)" = /ucrt64/bin/python
          test "$(command -v mingw32-make)" = /ucrt64/bin/mingw32-make
          pacman -Q mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libgomp mingw-w64-ucrt-x86_64-make mingw-w64-ucrt-x86_64-python
          gcc -dumpmachine
          gcc -print-prog-name=ld
          gcc -print-search-dirs
          for lib in libgomp.dll.a libgomp.a; do
            path=$(gcc -print-file-name="$lib")
            test "$path" != "$lib"
            test -f "$path"
            pacman -Qo "$path"
          done
      - name: Compile and test on the target platform
        shell: msys2 {0}
        run: mingw32-make CC=gcc PYTHON=python build test check-openmp

  report:
    name: report-xelatex
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install report tools on the temporary CI runner
        run: |
          set -euo pipefail
          sources="$RUNNER_TEMP/report-ubuntu.list"
          apt_options=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=- -o Acquire::Retries=1)
          packages=(texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-science)
          keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg

          # Keep a slow regional mirror from consuming the entire job timeout.
          downloaded=false
          for mirror in http://azure.archive.ubuntu.com/ubuntu http://archive.ubuntu.com/ubuntu; do
            cat > "$sources" <<EOF
          deb [signed-by=$keyring] $mirror noble main restricted universe multiverse
          deb [signed-by=$keyring] $mirror noble-updates main restricted universe multiverse
          deb [signed-by=$keyring] $mirror noble-backports main restricted universe multiverse
          deb [signed-by=$keyring] http://security.ubuntu.com/ubuntu noble-security main restricted universe multiverse
          EOF
            echo "Fetching TeX Live from $mirror"
            if sudo timeout 90s apt-get "${apt_options[@]}" update --error-on=any &&
               sudo timeout 180s apt-get "${apt_options[@]}" install -y --download-only --no-install-recommends "${packages[@]}"; then
              downloaded=true
              break
            fi
            echo "Could not download TeX Live via $mirror within the attempt limits." >&2
          done

          if [[ "$downloaded" != true ]]; then
            echo "TeX Live packages could not be downloaded from either Ubuntu mirror." >&2
            exit 1
          fi
          sudo apt-get "${apt_options[@]}" install -y --no-download --no-install-recommends "${packages[@]}"
      - name: Compile the real report
        run: make report
      - name: Preserve report for PDF inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bootstrap-report-${{ github.sha }}
          path: |
            report/main.pdf
            report/main.log
            report/main.bbl
            report/main.toc
          if-no-files-found: error
