name: Bootstrap CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: bootstrap-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-05
        with:
          persist-credentials: false
      - name: Compile and test the real scaffold
        run: make CC=gcc PYTHON=python3 test check-openmp
      - name: Require a real two-thread OpenMP team
        env:
          OMP_DYNAMIC: 'FALSE'
          OMP_THREAD_LIMIT: '2'
        run: |
          output=$(./build/openmp_probe)
          echo "$output"
          [[ "$output" == *"team=2 "* ]]

  windows:
    name: bootstrap-windows-ucrt64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2, verified 2026-11-05
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Compile and test on the target platform
        shell: msys2 {0}
        run: make CC=gcc PYTHON=python test check-openmp
      - name: Require a real two-thread OpenMP team
        shell: msys2 {0}
        env:
          OMP_DYNAMIC: 'FALSE'
          OMP_THREAD_LIMIT: '2'
        run: |
          output=$(./build/openmp_probe.exe)
          echo "$output"
          [[ "$output" == *"team=2 "* ]]

  report:
    name: report-xelatex
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install report tools on the temporary CI runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-fonts-recommended
      - name: Compile the real report
        run: make report
